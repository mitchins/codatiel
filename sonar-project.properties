# SonarCloud scope: test fixtures and eval corpora are deterministic
# replay data, not hand-maintained logic. Duplication inside data files
# is expected (same fixtures/windows recur across cases) and carries no
# maintainability signal, so exclude them from copy-paste detection
# only. All other gates (bugs, vulnerabilities, coverage) still apply.
sonar.cpd.exclusions=tests/fixtures/**,eval/**
