name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shareable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test and SDK extras
        run: pip install -e ".[test,sdk]"
      - name: Compile check
        run: python -m compileall -q codatiel_i2 eval tests
      - name: Shareable product tests (synthetic repos only; no network, no credentials)
        run: >-
          python -m pytest tests/test_evidence_validation_contract.py
          tests/test_spend_accounting.py
          tests/test_canonical_service.py
          tests/test_operational_integration.py
          tests/test_disposition_route.py
          tests/test_trust_gate.py
          tests/test_evidence_anchor.py
          tests/test_sdk_runtime_smoke.py
          tests/test_run_artifacts.py
          tests/test_fixture_store.py
          tests/test_no_legacy_imports.py
          tests/test_investigation_tools.py
          tests/test_workspace_identity.py
          tests/test_workspace_fallback.py
          tests/test_haiku_adapter_mapping.py
          tests/test_file_accounting.py
          tests/test_m7_cost_statement.py
          tests/test_m7_evidence_replay.py -q
      - name: CLI smoke test (scripted review + fixture digest, no inference)
        run: |
          python - <<'EOF'
          import json, subprocess, tempfile
          from pathlib import Path
          from codatiel_i2 import service as S
          tmp = Path(tempfile.mkdtemp()); root = tmp / "r"; root.mkdir()
          subprocess.run(["git", "-C", root, "init", "-q"], check=True)
          subprocess.run(["git", "-C", root, "config", "user.email", "t@t"], check=True)
          subprocess.run(["git", "-C", root, "config", "user.name", "t"], check=True)
          (root / "a.py").write_text("x=1\n")
          subprocess.run(["git", "-C", root, "add", "."], check=True)
          subprocess.run(["git", "-C", root, "commit", "-qm", "b"], check=True)
          base = subprocess.run(["git", "-C", root, "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          (root / "a.py").write_text("x=2\n")
          subprocess.run(["git", "-C", root, "commit", "-qam", "h"], check=True)
          head = subprocess.run(["git", "-C", root, "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          sc = tmp / "s.json"
          sc.write_text(json.dumps({"turns": [], "final": {"status": "silence", "summary": "ci", "findings": []}}))
          out = S.review_local(root, base, head, model=S.scripted_model_from_scenario(str(sc)),
                               model_name="scripted:ci", runs_root=tmp / "runs", work_root=tmp / "work")
          assert out["status"] == "complete", out
          print("cli-smoke-ok", out["run_id"])
          EOF
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Blocked-pattern scan (keys, tokens, private keys, env files)
        run: |
          ! grep -rniE "sk-[A-Za-z0-9]{10,}|gho_[A-Za-z0-9_]+|xox[bpas]-|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY-----" \
            --include="*.py" --include="*.json" --include="*.toml" --include="*.md" --include="*.yml" . \
            | grep -v "workflows/ci.yml"
          test ! -f .env && test ! -f .env.local
